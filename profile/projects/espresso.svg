    </style>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#0d1117" stroke="#1793d1"/>
  <text x="18" y="60" class="sans" font-size="30" font-weight="700" fill="#f0f6fc">ESPresso</text>
  <text x="18" y="84" class="sans" font-size="16" fill="#c9d1d9">Tauri 2 + React + TypeScript app</text>
  <text x="18" y="102" class="sans" font-size="16" fill="#c9d1d9">for coffee profiles on LAN.</text>
