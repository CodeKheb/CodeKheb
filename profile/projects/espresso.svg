  <title id="title">ESPresso</title>
  <desc id="desc">Tauri 2 + React + TypeScript desktop app for sharing coffee profiles over any local network.</desc>
  <defs>
    <style>
      .mono { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
