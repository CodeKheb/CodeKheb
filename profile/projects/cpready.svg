<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">CPReady</title>
  <desc id="desc">An ESP32-based CPR training vest with real-time compression feedback, paired with a Flutter Android app that coaches trainees and logs session history.</desc>
  <defs>
    <style>
      .mono { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: 'Segoe UI', Ubuntu, sans-serif; }
      .muted { fill: #8b949e; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="199" rx="6" fill="#0d1117" stroke="#1793d1"/>
  <text x="24" y="62" class="sans" font-size="26" font-weight="700" fill="#f0f6fc">CPReady</text>
  <text x="24" y="88" class="sans" font-size="14" fill="#c9d1d9">ESP32 CPR training vest with real-time compression feedback and a Flutter coaching app.</text>
  <text x="24" y="114" class="mono" font-size="13" fill="#1793d1">$ pio run -e esp32dev -t upload</text>
  <text x="776" y="182" class="mono muted" font-size="11" text-anchor="end">github.com/Marni3/CPReady</text>
</svg>
