<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
  <title id="title">CodeShare</title>
  <desc id="desc">Real-time collaboration, with GitHub in your team chat.</desc>
  <defs>
    <style>
      .mono { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: 'Segoe UI', Ubuntu, sans-serif; }
      .muted { fill: #8b949e; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#0d1117" stroke="#1793d1"/>
  <text x="18" y="60" class="sans" font-size="30" font-weight="700" fill="#f0f6fc">CodeShare</text>
  <text x="18" y="84" class="sans" font-size="16" fill="#c9d1d9">Real-time collaboration,</text>
  <text x="18" y="102" class="sans" font-size="16" fill="#c9d1d9">with GitHub in your chat.</text>
  <text x="18" y="122" class="mono" font-size="14" fill="#1793d1">$ open helloworld-codeshare.onrender.com</text>
  <text x="477" y="182" class="mono muted" font-size="10" text-anchor="end">github.com/CodeKheb/HelloWorld-CodeShare</text>
</svg>
